name: Build Multi-Platform

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            profile: macos
            artifact-name: "macOS"
          - os: windows-latest
            profile: windows
            artifact-name: "Windows"
          - os: ubuntu-latest
            profile: linux
            artifact-name: "Linux"

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

    - name: Build with Maven (Platform Specific)
      run: mvn clean package -P${{ matrix.profile }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}-build
        path: target/jpackage/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v3

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Generate release info
      id: release_info
      run: |
        TAG_NAME="v$(date +'%Y.%m.%d')-build.${{ github.run_number }}"
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        echo "release_name=Dev Cleaner Pro $TAG_NAME" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.release_info.outputs.tag_name }}
        name: ${{ steps.release_info.outputs.release_name }}
        make_latest: true
        body: |
          # Dev Cleaner Pro ${{ steps.release_info.outputs.tag_name }}

          Automated release built from commit ${{ github.sha }}

          ## Downloads
          - **macOS**: Download the `.dmg` file (Apple Silicon & Intel compatible)
          - **Windows**: Download the `.msi` file (Windows Installer)
          - **Linux**: Download the `.deb` file (Debian/Ubuntu package)

          ## Installation
          1. Download the appropriate file for your platform
          2. Install following your platform's standard procedure
          3. Launch Dev Cleaner Pro

          Built on: $(date +'%Y-%m-%d %H:%M:%S UTC')
        files: artifacts/**/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}